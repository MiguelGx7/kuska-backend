      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un valor de entero único que identifique este categoría.
        required: true
      tags:
      - Admin - Categorías
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
        '401':
          description: Sin token, token vencido o credenciales incorrectas.

                  value:
                    detail: Las credenciales de autenticación no se proveyeron.
                credenciales:
                  summary: Login fallido
                  value:
                    detail: Correo o contraseña incorrectos.
        '403':
          description: La cuenta no está activa o el rol no tiene permiso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                rol:
                  summary: Rol sin permiso
                  value:
                    detail: Esta acción es solo para administradores.
                bloqueado:
                  summary: Cuenta bloqueada
                  value:
                    detail: Tu cuenta está bloqueada hasta el 20/10/2026 a las 18:30.
        '404':
          description: No existe o no es del usuario (no se revela que existe).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                no_encontrado:
                  summary: No encontrado
                  value:
                    detail: No encontramos esa solicitud.
    put:
      operationId: admin_categorias_update
      description: Inactivarla (activa=false) impide usarla en alimentos nuevos; los
        que ya la tienen no cambian (RN-17).
      summary: Editar categoría

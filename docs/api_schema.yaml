                    detail: Las credenciales de autenticación no se proveyeron.
                credenciales:
                  summary: Login fallido
                  value:
                    detail: Correo o contraseña incorrectos.
        '403':
          description: La cuenta no está activa o el rol no tiene permiso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                rol:
                  summary: Rol sin permiso
                  value:
                    detail: Esta acción es solo para administradores.
                bloqueado:
                  summary: Cuenta bloqueada
                  value:
                    detail: Tu cuenta está bloqueada hasta el 20/10/2026 a las 18:30.
        '404':
          description: No existe o no es del usuario (no se revela que existe).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                no_encontrado:
                  summary: No encontrado
                  value:
                    detail: No encontramos esa solicitud.
    patch:
      operationId: admin_categorias_partial_update
      description: Igual que editar, enviando solo los campos que cambian (RN-17).
      summary: Editar parte de una categoría
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un valor de entero único que identifique este categoría.
        required: true
      tags:
      - Admin - Categorías
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedCategoriaRequest'
            examples:
              inactivar:
                summary: Inactivar
                value:
                  activa: false
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedCategoriaRequest'
          multipart/form-data:

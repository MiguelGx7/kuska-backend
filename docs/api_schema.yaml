            schema:
              $ref: '#/components/schemas/CategoriaRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CategoriaRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CategoriaRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Categoria'
          description: ''
        '400':
          description: Datos inválidos o la regla de negocio no permite la acción.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorValidacion'
              examples:
                por_campo:
                  summary: Error en un campo
                  value:
                    motivo_rechazo:
                    - Debes indicar el motivo del rechazo.
                regla:
                  summary: Regla de negocio
                  value:
                  - 'No se puede aprobar: la solicitud está Cancelada y debe estar
                    Pendiente.'
        '401':
          description: Sin token, token vencido o credenciales incorrectas.
          content:

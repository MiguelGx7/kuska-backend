    patch:
      operationId: admin_configuracion_partial_update
      description: Plazos y límites deben ser mayores que 0, el margen no puede ser
        negativo y el porcentaje va de 0 (sin incluir) a 100. Los cambios solo aplican
        hacia adelante.
      summary: Editar la configuración
      tags:
      - Admin - Configuración
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedConfiguracionRequest'
            examples:
              plazo:
                summary: Cambiar el plazo
                value:
                  plazo_recogida_dias: 4
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedConfiguracionRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedConfiguracionRequest'
      security:
      - jwtAuth: []
      responses:

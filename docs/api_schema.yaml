openapi: 3.0.3
info:
  title: Kumora API
  version: 1.0.0
  description: 'Red de Alimentos Solidarios: API REST del backend.'
paths:
  /api/admin/categorias/:
    get:
      operationId: admin_categorias_list
      description: 'Filtro: activa. Búsqueda por nombre.'
      summary: Listar categorías
      parameters:
      - in: query
        name: activa
        schema:
          type: boolean
      - name: ordering
        required: false
        in: query
        description: Qué campo usar para ordenar los resultados.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: Un número de página dentro del conjunto de resultados paginado.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: Un término de búsqueda.
        schema:
          type: string
      tags:
      - Admin - Categorías
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCategoriaList'
          description: ''
        '401':
          description: Sin token, token vencido o credenciales incorrectas.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                sin_token:
                  summary: Sin token
                  value:
                    detail: Las credenciales de autenticación no se proveyeron.
                credenciales:
                  summary: Login fallido
                  value:
                    detail: Correo o contraseña incorrectos.
        '403':
          description: La cuenta no está activa o el rol no tiene permiso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                rol:
                  summary: Rol sin permiso
                  value:
                    detail: Esta acción es solo para administradores.
                bloqueado:
                  summary: Cuenta bloqueada
                  value:
                    detail: Tu cuenta está bloqueada hasta el 20/10/2026 a las 18:30.
    post:
      operationId: admin_categorias_create
      description: Nombre único (sin importar mayúsculas). Queda activa.
      summary: Crear categoría
      tags:
      - Admin - Categorías
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoriaRequest'
            examples:
              crear:
                summary: Crear
                value:
                  nombre: Cereales
                  descripcion: Avena, granola
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CategoriaRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CategoriaRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Categoria'
          description: ''
        '400':
          description: Datos inválidos o la regla de negocio no permite la acción.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorValidacion'
              examples:
                por_campo:
                  summary: Error en un campo
                  value:
                    motivo_rechazo:
                    - Debes indicar el motivo del rechazo.
                regla:
                  summary: Regla de negocio
                  value:
                  - 'No se puede aprobar: la solicitud está Cancelada y debe estar
                    Pendiente.'
        '401':
          description: Sin token, token vencido o credenciales incorrectas.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                sin_token:
                  summary: Sin token
                  value:
                    detail: Las credenciales de autenticación no se proveyeron.
                credenciales:
                  summary: Login fallido
                  value:
                    detail: Correo o contraseña incorrectos.
        '403':
          description: La cuenta no está activa o el rol no tiene permiso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                rol:
                  summary: Rol sin permiso
                  value:
                    detail: Esta acción es solo para administradores.
                bloqueado:
                  summary: Cuenta bloqueada
                  value:
                    detail: Tu cuenta está bloqueada hasta el 20/10/2026 a las 18:30.
  /api/admin/categorias/{id}/:

components:
  schemas:
    AceptarNovedadRequest:
      type: object
      properties:
        respuesta_admin:
          type: string
          maxLength: 255
    AdminDonacion:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        titulo:
          type: string
          readOnly: true
        descripcion:
          type: string
          readOnly: true
          nullable: true
        direccion_recogida:
          type: string
          readOnly: true
          nullable: true
        modalidad_entrega:
          allOf:
          - $ref: '#/components/schemas/ModalidadDonacionEnum'
          readOnly: true
        estado:
          allOf:
          - $ref: '#/components/schemas/EstadoDonacionEnum'
          readOnly: true
        motivo_rechazo:
          type: string
          readOnly: true
          nullable: true
        fecha_revision:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        fecha_registro:
          type: string
          format: date-time
          readOnly: true
        fecha_actualizacion:
          type: string
          format: date-time
          readOnly: true
        alimentos:
          type: array
          items:
            $ref: '#/components/schemas/Alimento'
          readOnly: true
        donante:
          allOf:
          - $ref: '#/components/schemas/DonanteResumen'
          readOnly: true
        revisada_por:
          type: string
          format: email
          readOnly: true
          nullable: true
      required:
      - alimentos
      - descripcion
      - direccion_recogida
      - donante
      - estado
      - fecha_actualizacion
      - fecha_registro
      - fecha_revision
      - id
      - modalidad_entrega
      - motivo_rechazo
      - revisada_por
      - titulo
    AdminNovedad:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        donacion:
          type: integer
          readOnly: true
        donacion_titulo:
          type: string
          readOnly: true
        donacion_alimento:
          type: integer
          readOnly: true
          nullable: true

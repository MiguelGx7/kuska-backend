  /api/admin/donaciones/:
    get:
      operationId: admin_donaciones_list
      description: 'Filtros: estado y donante (id). Búsqueda por título o correo del
        donante. Antes de listar aplica los vencimientos (RN-50) a los registros que
        estén vencidos.'
      summary: Listar donaciones
      parameters:
      - in: query
        name: donante
        schema:
          type: number
        description: id del donante
      - in: query
        name: estado
        schema:
          type: string
          enum:
          - Agotada
          - Finalizada
          - Pendiente
          - Rechazada
          - Validada
        description: |-
          * `Pendiente` - Pendiente
          * `Validada` - Validada
          * `Rechazada` - Rechazada
          * `Agotada` - Agotada
          * `Finalizada` - Finalizada
      - name: ordering
        required: false
        in: query
        description: Qué campo usar para ordenar los resultados.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: Un número de página dentro del conjunto de resultados paginado.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: Un término de búsqueda.
        schema:
          type: string
      tags:
      - Admin - Donaciones
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAdminDonacionList'
          description: ''
        '401':
